name: Promote release to stable

# Manually promote a released tag to the `stable` branch, which self-hosters
# track for production. Refuses to promote a tag whose commit did not pass CI,
# so a bad release can never become `stable`. Rollback = re-run this with an
# older, known-good tag.
#
# The `stable` image tags (ghcr.io/techiebutler/freeframe-api and -web) move
# with the branch: the same digest the release's tag already points at, never
# a rebuild. Both images must exist before the branch moves, so the branch and
# the image tag never disagree. `branch_only` is for releases from before images
# were published (rolling back past them): it moves the branch and leaves the
# `stable` image tag where it was.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to promote to stable (e.g. v1.3.1)"
        required: true
        type: string
      force:
        description: "Skip the CI-green gate (only for tags with no CI, e.g. docs-only)"
        required: false
        type: boolean
        default: false
      branch_only:
        description: "Move only the stable branch, not the stable image tag (only for releases from before images were published)"
        required: false
        type: boolean
        default: false

# Each job declares what it needs.
permissions: {}

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        if: ${{ !inputs.branch_only }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        if: ${{ !inputs.branch_only }}
        uses: docker/setup-buildx-action@v4

      # Before the CI gate and before anything is pushed, so a tag with no
      # images is refused with the stable branch untouched.
      - name: Check the images exist
        if: ${{ !inputs.branch_only }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for image in freeframe-api freeframe-web; do
            digest="$(.github/scripts/image_digest.sh "ghcr.io/techiebutler/${image}:${TAG}")"
            if [ -z "${digest}" ]; then
              echo "::error::No published images for ${TAG}. Run the \"Publish images\" workflow for ${TAG} first, or re-run with branch_only=true for a release from before images were published."
              exit 1
            fi
            echo "ghcr.io/techiebutler/${image}:${TAG} is ${digest}"
          done

      - name: Verify CI is green, then move `stable`
        env:
          TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          COMMIT="$(git rev-list -n1 "refs/tags/${TAG}")"
          echo "Promoting ${TAG} (${COMMIT}) -> stable"

          if [ "${FORCE}" != "true" ]; then
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT}/check-runs")"
            # Exclude this workflow's OWN check-run: a workflow_dispatch run registers a
            # `promote` check-run on the default branch's HEAD commit. When a release is
            # promoted straight from main HEAD (the common case), that HEAD *is* the tag
            # commit being gated, so this run would count its own in_progress/failed
            # `promote` check as a non-success and refuse to promote against itself.
            checks="$(echo "$runs" | jq '[.check_runs[] | select(.name != "promote")]')"
            total="$(echo "$checks" | jq 'length')"
            bad="$(echo "$checks" | jq '[.[] | select(.conclusion != "success")] | length')"
            if [ "$total" -lt 1 ]; then
              echo "::error::No CI check-runs found for ${TAG} (${COMMIT}); refusing to promote. Re-run with force=true only if this tag legitimately has no CI."
              exit 1
            fi
            if [ "$bad" -gt 0 ]; then
              echo "::error::${TAG} has non-success checks; refusing to promote:"
              echo "$checks" | jq -r '.[] | select(.conclusion != "success") | "  - \(.name): \(.conclusion // .status)"'
              exit 1
            fi
            echo "All ${total} CI check(s) green for ${TAG}."
          else
            echo "::warning::force=true — skipping the CI-green gate for ${TAG}."
          fi

          git push --force origin "${COMMIT}:refs/heads/stable"
          echo "::notice::stable now points at ${TAG} (${COMMIT})"

      # A retag from a single index without --annotation keeps its digest, so
      # `stable` is byte-for-byte the release's image and keeps its attestation.
      - name: Move the `stable` image tags
        if: ${{ !inputs.branch_only }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          failed=0
          for image in freeframe-api freeframe-web; do
            ref="ghcr.io/techiebutler/${image}"
            docker buildx imagetools create -t "${ref}:stable" "${ref}:${TAG}"
            release="$(.github/scripts/image_digest.sh "${ref}:${TAG}")"
            stable="$(.github/scripts/image_digest.sh "${ref}:stable")"
            echo "${ref}:${TAG} ${release}"
            echo "${ref}:stable ${stable}"
            if [ -z "${release}" ] || [ "${stable}" != "${release}" ]; then
              echo "::error::${ref}:stable (${stable:-missing}) does not match ${ref}:${TAG} (${release:-missing})."
              failed=1
            fi
          done
          exit "${failed}"

      - name: Leave the `stable` image tags alone
        if: ${{ inputs.branch_only }}
        env:
          TAG: ${{ inputs.tag }}
        run: echo "::notice::branch_only=true, so only the stable branch moved to ${TAG}; the stable image tag was left where it was."
